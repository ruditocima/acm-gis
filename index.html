<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoConvert Pro | KML to DXF</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@4.2.0/dist/togeojson.umd.js"></script>

    <!-- FIX: Menggunakan CDN yang lebih stabil untuk osmtogeojson -->
    <script src="https://cdn.jsdelivr.net/npm/osmtogeojson@3.2.1/osmtogeojson.js"></script>

    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        .glass-panel { background: rgba(23, 25, 35, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-right: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000; }
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #10b981; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-left: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-row bg-gray-900 text-gray-200">
    <div class="glass-panel w-80 h-screen flex flex-col shadow-2xl absolute left-0 top-0 transition-transform duration-300">
        <div class="p-6 border-b border-gray-700/50">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">GeoConvert Pro</h1>
            <p class="text-xs text-gray-400">KMZ to DXF Converter</p>
        </div>
        <div class="p-6 flex-1 overflow-y-auto space-y-6">
            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase">Import Data</h2>
                <div class="file-upload-wrapper">
                    <button class="w-full py-3 px-4 border-2 border-dashed border-gray-600 rounded-lg hover:border-emerald-500 hover:bg-emerald-500/10 transition-colors flex flex-col items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up text-2xl text-gray-400"></i>
                        <span class="text-sm">Upload KML / KMZ</span>
                    </button>
                    <input type="file" id="fileInput" accept=".kml,.kmz" />
                </div>
            </div>
            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50">
                <button id="btn-fetch-osm" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium text-sm disabled:opacity-50" disabled>
                    <i class="fa-solid fa-city mr-2"></i> Refresh Buildings & Roads
                </button>
            </div>
        </div>
        <div class="p-6 border-t border-gray-700/50 flex flex-col gap-3">
            <button id="btn-export" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-lg font-bold text-sm">Export to DXF</button>
        </div>
    </div>
    <div id="map"></div>

    <script>
        const map = L.map('map', { center: [-0.7893, 113.9213], zoom: 5 });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(map);
        
        const kmlGroup = L.featureGroup().addTo(map);
        const osmGroup = L.featureGroup().addTo(map);
        let currentBbox = null;

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const kmlText = await file.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(kmlText, 'text/xml');
                const geojson = toGeoJSON.kml(xmlDoc);
                
                kmlGroup.clearLayers();
                const layer = L.geoJSON(geojson).addTo(kmlGroup);
                map.fitBounds(layer.getBounds());
                
                currentBbox = layer.getBounds();
                document.getElementById('btn-fetch-osm').disabled = false;
                
                // Trigger otomatis
                fetchOSMData(currentBbox);
            } catch (err) {
                Swal.fire('Error', 'Gagal memproses file: ' + err.message, 'error');
            }
        });

        async function fetchOSMData(bbox) {
            const s = bbox.getSouth(), w = bbox.getWest(), n = bbox.getNorth(), e_coord = bbox.getEast();
            
            // Cek apakah library sudah terdefinisi
            if (typeof osmtogeojson === 'undefined') {
                Swal.fire('Error', 'Library osmtogeojson tidak ditemukan!', 'error');
                return;
            }

            const query = `[out:json][timeout:25];(way["building"](${s},${w},${n},${e_coord});way["highway"](${s},${w},${n},${e_coord}););out body;>;out skel qt;`;
            
            try {
                const response = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: query });
                const data = await response.json();
                
                // Konversi menggunakan library
                const geojson = osmtogeojson(data);
                
                osmGroup.clearLayers();
                L.geoJSON(geojson, {
                    style: (f) => f.properties.building ? { color: '#f59e0b' } : { color: '#9ca3af' }
                }).addTo(osmGroup);
                
                Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Data OSM berhasil dimuat!', showConfirmButton: false, timer: 2000 });
            } catch (err) {
                Swal.fire('Error', 'Gagal fetch: ' + err.message, 'error');
            }
        }
    </script>
</body>
</html>
