<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS | ACM</title>

    <!-- Tailwind CSS (Static Production Build) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">

    <!-- Leaflet CSS & JS (for Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Geoman (for drawing/editing) -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.min.js"></script>

    <!-- JSZip (for KMZ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- toGeoJSON (for KML to GeoJSON) -->
    <script src="https://unpkg.com/@tmcw/togeojson@4.2.0/dist/togeojson.umd.js"></script>

    <!-- Turf.js (for spatial processing, buffer & area calculation) -->
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

    <!-- SweetAlert2 (for alerts) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Leaflet MiniMap -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-minimap/3.6.1/Control.MiniMap.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-minimap/3.6.1/Control.MiniMap.min.js"></script>

    <!-- html2canvas for PNG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background: #111827;
        }

        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }

        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(23, 25, 35, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        /* Fancy file input */
        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
        }

        /* Custom Popup styling */
        .leaflet-popup-content-wrapper {
            background: #1f2937;
            color: #f3f4f6;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-family: 'Inter', sans-serif;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .leaflet-popup-tip {
            background: #1f2937;
        }
        .leaflet-popup-content b {
            color: #10b981;
            font-size: 1.1em;
            display: block;
            margin-bottom: 4px;
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #10b981;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Coordinate Display */
        .coord-display {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 6px 12px;
            font-family: 'Inter', monospace;
            font-size: 11px;
            color: #e5e7eb;
            pointer-events: auto;
            user-select: text;
        }
        .coord-label {
            color: #6b7280;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        .loading-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Layer item in sidebar */
        .layer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
        }

        /* Range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            margin-top: -5px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        /* Custom toast */
        .custom-toast {
            background: rgba(31, 41, 55, 0.98) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            color: #f3f4f6 !important;
        }

        /* Mini map custom */
        .leaflet-control-minimap {
            border: 2px solid rgba(255,255,255,0.1) !important;
            border-radius: 8px !important;
        }
        
        /* Styling Vertex Marker Leaflet Geoman */
        .leaflet-pm-edit-marker,
        .leaflet-marker-icon.pm-edit-marker {
            width: 10px !important;
            height: 10px !important;
            margin-left: -5px !important;
            margin-top: -5px !important;
            background-color: #3b82f6 !important;
            border: 2px solid #ffffff !important;
            border-radius: 50% !important;
            z-index: 2000 !important;
        }
    </style>
</head>

    <!-- Application Logic -->
    <script>
        const App = {
            config: {
                maxUndoStack: 30,
                osmTimeout: 30000,
                defaultRoadWidth: 6,
                coordinatePrecision: 6,
                version: '2.1.0-lite'
            },
            state: {
                isMeasureMode: false,
                measureType: null,
                measurePoints: [],
                measureLayer: null,
                measureTooltip: null,
                clipboardGeoJSON: null,
                lastSelectedLayer: null,
                currentBbox: null,
                uploadedKmlFeatures: [],
                coordFormat: 'dd',
                activeDeviceTool: null
            },
            groups: {},
            undoStack: [],
            map: null,
            layers: {
                osm: null,
                earth: null
            }
        };

        // --- Coordinate Utilities ---
        const CoordUtils = {
            toDMS(deg, isLat) {
                const absolute = Math.abs(deg);
                const degrees = Math.floor(absolute);
                const minutesFloat = (absolute - degrees) * 60;
                const minutes = Math.floor(minutesFloat);
                const seconds = ((minutesFloat - minutes) * 60).toFixed(2);
                const direction = isLat ? (deg >= 0 ? 'N' : 'S') : (deg >= 0 ? 'E' : 'W');
                return `${degrees}° ${minutes}' ${seconds}" ${direction}`;
            },

            toUTM(lon, lat) {
                const zone = Math.floor((lon + 180) / 6) + 1;
                const hemisphere = lat >= 0 ? 'N' : 'S';
                const a = 6378137, e = 0.081819191, e2 = e * e, k0 = 0.9996;
                const lonRad = lon * Math.PI / 180, latRad = lat * Math.PI / 180;
                const lon0 = ((zone - 1) * 6 - 180 + 3) * Math.PI / 180;
                const N = a / Math.sqrt(1 - e2 * Math.sin(latRad) ** 2);
                const T = Math.tan(latRad) ** 2, C = e2 * Math.cos(latRad) ** 2 / (1 - e2);
                const A = Math.cos(latRad) * (lonRad - lon0);
                const M = a * ((1 - e2/4 - 3*e2*e2/64 - 5*e2*e2*e2/256) * latRad - (3*e2/8 + 3*e2*e2/32 + 45*e2*e2*e2/1024) * Math.sin(2*latRad) + (15*e2*e2/256 + 45*e2*e2*e2/1024) * Math.sin(4*latRad) - (35*e2*e2*e2/3072) * Math.sin(6*latRad));
                const easting = k0 * N * (A + (1-T+C) * A**3/6) + 500000;
                let northing = k0 * (M + N * Math.tan(latRad) * (A*A/2 + (5-T+9*C) * A**4/24));
                if (lat < 0) northing += 10000000;
                return `Zone ${zone}${hemisphere} | E: ${easting.toFixed(1)} | N: ${northing.toFixed(1)}`;
            },

            format(lon, lat, format) {
                if (format === 'dms') return `${this.toDMS(lat, true)} | ${this.toDMS(lon, false)}`;
                if (format === 'utm') return this.toUTM(lon, lat);
                return `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
            }
        };

        // --- UI Utilities ---
        const UI = {
            showLoading(text, subtext) {
                const overlay = document.getElementById('loadingOverlay');
                document.getElementById('loadingText').textContent = text || 'Memproses...';
                document.getElementById('loadingSub').textContent = subtext || 'Mohon tunggu sebentar';
                overlay.classList.add('active');
            },
            hideLoading() {
                document.getElementById('loadingOverlay').classList.remove('active');
            },
            updateFeatureCounts() {
                let kmlCount = 0, osmCount = 0, drawCount = 0;
                function countLayers(group) {
                    let count = 0;
                    if (group && group.eachLayer) group.eachLayer(() => count++);
                    return count;
                }
                if (App.groups.kml) kmlCount = countLayers(App.groups.kml);
                if (App.groups.osm) osmCount = countLayers(App.groups.osm);
                if (App.groups.draw) drawCount = countLayers(App.groups.draw);

                document.getElementById('count-kml').textContent = kmlCount;
                document.getElementById('count-osm').textContent = osmCount;
                document.getElementById('count-draw').textContent = drawCount;
            },
            toast(icon, title, timer = 2000) {
                Swal.fire({
                    toast: true, position: 'top-end', icon: icon, title: title,
                    showConfirmButton: false, timer: timer, customClass: { popup: 'custom-toast' }
                });
            }
        };

        const canvasRenderer = L.canvas({ padding: 0.5, tolerance: 10 });

        function processAllSubLayers(group, callback) {
            if (!group) return;
            if (group.eachLayer) {
                group.eachLayer(child => processAllSubLayers(child, callback));
            } else {
                callback(group);
            }
        }

        const blueDotIcon = L.divIcon({
            className: 'custom-blue-dot-symbol',
            html: '<div style="background-color: #38bdf8; width: 10px; height: 10px; border: 2px solid #ffffff; border-radius: 50%;"></div>',
            iconSize: [10, 10], iconAnchor: [5, 5]
        });

        // --- Network Device Icon Generators ---
        function getDeviceIcon(type) {
            let bgCol = '#10b981';
            let iconClass = 'fa-network-wired';
            if (type === 'ODC') { bgCol = '#d97706'; iconClass = 'fa-server'; }
            else if (type === 'ODP') { bgCol = '#059669'; iconClass = 'fa-network-wired'; }

        function pushUndoAction(action) {
            App.undoStack.push(action);

        function performUndo() {
            if (App.undoStack.length === 0) {
                UI.toast('info', 'Tidak ada riwayat aksi untuk di-undo!', 2000);
                return;
            }
            const lastAction = App.undoStack.pop();
            if (lastAction.type === 'add') {
                if (lastAction.group && lastAction.layer) lastAction.group.removeLayer(lastAction.layer);
                else if (lastAction.layer) App.map.removeLayer(lastAction.layer);
            } else if (lastAction.type === 'remove') {
                if (lastAction.group && lastAction.layer) lastAction.group.addLayer(lastAction.layer);
                else if (lastAction.layer) App.map.addLayer(lastAction.layer);
            }
            UI.updateFeatureCounts();
            UI.toast('success', 'Aksi dibatalkan (Undo)', 1500);
        }

        function validateCoords(coords) {
            if (!Array.isArray(coords)) return false;
            for (let c of coords) {
                if (!Array.isArray(c) || c.length < 2 || isNaN(c[0]) || isNaN(c[1])) return false;
                if (c[0] < -180 || c[0] > 180 || c[1] < -90 || c[1] > 90) return false;
            }
            return true;
        }

        function sanitizeGeoJSON(geojson) {
            if (!geojson || !geojson.features) return geojson;
            geojson.features = geojson.features.filter(f => {
                if (!f.geometry || !f.geometry.coordinates) return false;
                const t = f.geometry.type;
                if (t === 'Polygon') return validateCoords(f.geometry.coordinates[0]);
                if (t === 'LineString') return validateCoords(f.geometry.coordinates);
                return true;
            });
            return geojson;
        }

        // --- Fixed OSM to GeoJSON parser using `out geom;` ---
        function customOSMToGeoJSON(data) {
            const features = [];
            if (!data || !data.elements) return { type: "FeatureCollection", features: [] };
            data.elements.forEach(el => {
                if (el.type === 'way' && el.geometry && el.tags) {
                    const coords = el.geometry.map(pt => [pt.lon, pt.lat]);
                    if (coords.length < 2) return;
                    let isPolygon = false;
                    if (el.tags.building || el.tags.landuse || el.tags.amenity || el.tags.leisure) isPolygon = true;
                    if (coords.length >= 4 && coords[0][0] === coords[coords.length - 1][0] && coords[0][1] === coords[coords.length - 1][1]) isPolygon = true;

                    if (isPolygon) {
                        if (coords[0][0] !== coords[coords.length - 1][0] || coords[0][1] !== coords[coords.length - 1][1]) coords.push(coords[0]);
                        features.push({ type: "Feature", geometry: { type: "Polygon", coordinates: [coords] }, properties: { id: el.id, ...el.tags } });
                    } else {
                        features.push({ type: "Feature", geometry: { type: "LineString", coordinates: coords }, properties: { id: el.id, ...el.tags } });
                    }
                }
            });
            return { type: "FeatureCollection", features: features };
        }

        document.getElementById('btn-fetch-osm').addEventListener('click', async () => {
            if (!App.state.currentBbox) {
                Swal.fire('Warning', 'Upload file KML boundary terlebih dahulu!', 'warning');
                return;
            }

            UI.showLoading('Mengambil Data OSM...', 'Menghubungkan ke server Overpass API');
            const b = App.state.currentBbox;
            const bboxStr = `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
            
            const query = `[out:json][timeout:25];(way["building"](${bboxStr});way["highway"](${bboxStr}););out geom;`;

            const endpoints = [
                'https://overpass-api.de/api/interpreter',
                'https://lz4.overpass-api.de/api/interpreter',
                'https://overpass.kumi.systems/api/interpreter'
            ];

            let successData = null;
            for (let url of endpoints) {
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: "data=" + encodeURIComponent(query)
                    });
                    if (res.ok) {
                        const json = await res.json();
                        if (json && json.elements) { successData = json; break; }
                    }
                } catch (e) { continue; }
            }

            UI.hideLoading();
            if (!successData) {
                Swal.fire('Error', 'Gagal mengambil data OSM (Timeout/Server Sibuk).', 'error');
                return;
            }

            const fetchedGeoJSON = customOSMToGeoJSON(successData);
            
            let finalGeoJSON = fetchedGeoJSON;
            if (App.state.uploadedKmlFeatures && App.state.uploadedKmlFeatures.length > 0) {
                const filteredFeatures = fetchedGeoJSON.features.filter(osmFeat => {
                    if (!osmFeat.geometry) return false;
                    return App.state.uploadedKmlFeatures.some(kmlFeat => {
                        try {
                            return turf.booleanIntersects(osmFeat, kmlFeat);
                        } catch (e) {
                            return false;
                        }
                    });
                });
                finalGeoJSON = { type: "FeatureCollection", features: filteredFeatures };
            }

            App.groups.osm.clearLayers();

            const roadWidth = parseFloat(document.getElementById('roadWidthInput').value) || 6;

            const osmLayer = L.geoJSON(finalGeoJSON, {
                renderer: canvasRenderer,

                    if (f.properties.building) return { color: '#f59e0b', weight: 1, fillColor: '#f59e0b', fillOpacity: 0.4 };

                    l.options.interactive = true;
                    l.options.pmIgnore = false;
                    bindNamePopup(l);
                }
            });

            UI.updateFeatureCounts();
            UI.toast('success', 'Data OSM Buildings & Roads berhasil dimuat!', 2000);

        function escapeXml(unsafe) {
            return unsafe.toString().replace(/[<>&'"]/g, function (c) {
                switch (c) {
                    case '<': return '&lt;';
                    case '>': return '&gt;';
                    case '&': return '&amp;';
                    case '\'': return '&apos;';
                    case '"': return '&quot;';
                }
            });

            kmlString += '<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n';
            kmlString += '<name>GeoConvert ACM Export</name>\n';

            const allFeatures = [];
            [App.groups.kml, App.groups.osm, App.groups.draw].forEach(group => {
                processAllSubLayers(group, layer => {
                    if (typeof layer.toGeoJSON === 'function') {
                        allFeatures.push(layer.toGeoJSON());
                    }
                });
            });

            if (allFeatures.length === 0) {
                UI.hideLoading();
                Swal.fire('Warning', 'Tidak ada objek untuk diexport ke KML.', 'warning');
                return;
            }

            allFeatures.forEach((f, idx) => {
                const props = f.properties || f.options?.properties || {};
                const name = props.name || props.Name || props.title || `Feature_${idx+1}`;
                const desc = props.description || props.Description || '';
                const geom = f.geometry;
                if (!geom) return;

                kmlString += '<Placemark>\n';
                kmlString += `<name>${escapeXml(name)}</name>\n`;
                if (desc) {
                    kmlString += `<description>${escapeXml(desc)}</description>\n`;
                }

                if (geom.type === 'Point') {
                    kmlString += `<Point><coordinates>${geom.coordinates[0]},${geom.coordinates[1]},0</coordinates></Point>\n`;
                } else if (geom.type === 'LineString') {
                    kmlString += '<LineString><coordinates>\n';
                    geom.coordinates.forEach(pt => {
                        kmlString += `${pt[0]},${pt[1]},0 `;
                    });
                    kmlString += '\n</coordinates></LineString>\n';
                } else if (geom.type === 'Polygon') {
                    kmlString += '<Polygon><outerBoundaryIs><LinearRing><coordinates>\n';
                    geom.coordinates[0].forEach(pt => {
                        kmlString += `${pt[0]},${pt[1]},0 `;
                    });
                    kmlString += '\n</coordinates></LinearRing></outerBoundaryIs></Polygon>\n';
                }

                kmlString += '</Placemark>\n';
            });

            kmlString += '</Document>\n</kml>';

            UI.hideLoading();
            const blob = new Blob([kmlString], { type: 'application/vnd.google-earth.kml+xml' });

            const a = document.createElement('a');
            a.href = url;
            a.download = 'export_gis_acm.kml';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            UI.toast('success', 'Export KML Berhasil!', 1500);
        });

                Swal.fire('Warning', 'Tidak ada objek untuk diexport ke DXF.', 'warning');
                return;
            }

            allFeatures.forEach(f => {
                const geom = f.geometry;
                if (!geom) return;

                if (geom.type === 'Polygon') {
                    geom.coordinates.forEach(ring => {
                        dxfContent += "0\nLWPOLYLINE\n8\nGIS_LAYER\n90\n" + ring.length + "\n70\n1\n";
                        ring.forEach(pt => {
                            dxfContent += `10\n${pt[0]}\n20\n${pt[1]}\n`;
                        });
                        entityCount++;
                    });
                } else if (geom.type === 'LineString') {
                    dxfContent += "0\nLWPOLYLINE\n8\nGIS_LAYER\n90\n" + geom.coordinates.length + "\n70\n0\n";
                    geom.coordinates.forEach(pt => {
                        dxfContent += `10\n${pt[0]}\n20\n${pt[1]}\n`;
                    });
                    entityCount++;
                } else if (geom.type === 'Point') {
                    const pt = geom.coordinates;
                    dxfContent += `0\nPOINT\n8\nGIS_LAYER\n10\n${pt[0]}\n20\n${pt[1]}\n30\n0.0\n`;
                    entityCount++;
                }
            });

            dxfContent += "0\nENDSEC\n0\nEOF\n";

            UI.hideLoading();
            if (entityCount === 0) {
                Swal.fire('Warning', 'Tidak ada entitas valid untuk DXF.', 'warning');
                return;
            }

            const blob = new Blob([dxfContent], { type: 'application/dxf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'export_gis_acm.dxf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            UI.toast('success', 'Export DXF Berhasil!', 1500);
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
                e.preventDefault();
                performUndo();
            }
        });

        UI.updateFeatureCounts();
    </script>
</body>
</html>
