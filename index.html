<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS | ACM</title>

    <!-- Tailwind CSS (Static Production Build) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">

    <!-- Leaflet CSS & JS (for Maps) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Geoman (for drawing/editing) -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.min.js"></script>

    <!-- JSZip (for KMZ) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- toGeoJSON (for KML to GeoJSON) -->
    <script src="https://unpkg.com/@tmcw/togeojson@4.2.0/dist/togeojson.umd.js"></script>

    <!-- Turf.js (for spatial processing, buffer & area calculation) -->
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

    <!-- SweetAlert2 (for alerts) -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- Leaflet MiniMap -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-minimap/3.6.1/Control.MiniMap.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-minimap/3.6.1/Control.MiniMap.min.js"></script>

    <!-- html2canvas for PNG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background: #111827;
        }

        #map {
            height: 100vh;
            width: 100%;
            z-index: 1;
        }

        .glass-panel {
            background: rgba(23, 25, 35, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        .file-upload-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-upload-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
        }

        .leaflet-popup-content-wrapper {
            background: #1f2937;
            color: #f3f4f6;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            font-family: 'Inter', sans-serif;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .leaflet-popup-tip { background: #1f2937; }
        .leaflet-popup-content b {
            color: #10b981;
            font-size: 1.1em;
            display: block;
            margin-bottom: 4px;
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #10b981;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .coord-display {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 6px 12px;
            font-family: 'Inter', monospace;
            font-size: 11px;
            color: #e5e7eb;
            pointer-events: auto;
            user-select: text;
        }
        .coord-label {
            color: #6b7280;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .loading-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .search-box {
            background: rgba(31, 41, 55, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .layer-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            margin-top: -5px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
        }

        .custom-toast {
            background: rgba(31, 41, 55, 0.98) !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            color: #f3f4f6 !important;
        }

        .leaflet-control-minimap {
            border: 2px solid rgba(255,255,255,0.1) !important;
            border-radius: 8px !important;
        }
    </style>
</head>
<body class="flex flex-row bg-gray-900 text-gray-200">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader" style="width: 48px; height: 48px; border-width: 4px; margin-bottom: 16px;"></div>
        <div id="loadingText" class="text-gray-300 font-medium text-sm">Memproses...</div>
        <div id="loadingSub" class="text-gray-500 text-xs mt-2">Mohon tunggu sebentar</div>
    </div>

    <!-- Sidebar / Main Menu -->
    <div id="sidebar" class="glass-panel w-80 h-screen flex flex-col shadow-2xl absolute left-0 top-0 transition-transform duration-300">
        <div class="p-5 border-b border-gray-700 border-opacity-50 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold text-emerald-400 tracking-wide">
                    <i class="fa-solid fa-layer-group text-emerald-400 mr-2"></i> GeoConvert
                </h1>
                <p class="text-xs text-gray-400 mt-1">by: Rudi (Div YOFC)</p>
            </div>
        </div>

        <div class="p-5 flex-1 overflow-y-auto space-y-5">
            <!-- Base Layer -->
            <div class="bg-gray-800 bg-opacity-50 p-4 rounded-xl border border-gray-700 border-opacity-50">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase tracking-wider">Base Layer</h2>
                <div class="flex bg-gray-900 rounded-lg p-1">
                    <button id="btn-map" class="flex-1 py-2 text-sm rounded-md bg-emerald-500 bg-opacity-20 text-emerald-400 font-medium transition-all">
                        <i class="fa-solid fa-map mr-2"></i> Maps (OSM)
                    </button>
                    <button id="btn-earth" class="flex-1 py-2 text-sm rounded-md text-gray-400 hover:text-white transition-all">
                        <i class="fa-solid fa-globe mr-2"></i> Earth
                    </button>
                </div>
            </div>

            <!-- Upload Section -->
            <div class="bg-gray-800 bg-opacity-50 p-4 rounded-xl border border-gray-700 border-opacity-50">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase tracking-wider">Import Data</h2>
                <div class="file-upload-wrapper">
                    <button class="w-full py-3 px-4 border-2 border-dashed border-gray-600 rounded-lg hover:border-emerald-500 hover:bg-emerald-500 hover:bg-opacity-10 transition-colors flex flex-col items-center justify-center gap-2 group">
                        <i class="fa-solid fa-cloud-arrow-up text-2xl text-gray-400 group-hover:text-emerald-400"></i>
                        <span class="text-sm font-medium text-gray-300 group-hover:text-emerald-300">Upload KML / KMZ</span>
                    </button>
                    <input type="file" id="fileInput" accept=".kml,.kmz" />
                </div>
                <div id="file-info" class="mt-3 text-xs text-gray-400 hidden">
                    <span class="text-emerald-400"><i class="fa-solid fa-check-circle"></i> Loaded:</span> <span id="filename"></span>
                </div>
            </div>

            <!-- Layer Manager -->
            <div class="bg-gray-800 bg-opacity-50 p-4 rounded-xl border border-gray-700 border-opacity-50">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase tracking-wider">Layer Manager</h2>
                <div class="space-y-3">
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xs text-gray-400 font-medium">KML Upload</span>
                            <span id="count-kml" class="text-xs text-emerald-400 bg-emerald-400 bg-opacity-10 px-2 py-0.5 rounded-full">0</span>
                        </div>
                        <div class="layer-item">
                            <label class="flex items-center gap-2 cursor-pointer flex-1">
                                <input type="checkbox" id="toggle-kml" checked class="accent-emerald-500 w-4 h-4 rounded">
                                <span class="text-xs text-gray-300">Visibility</span>
                            </label>
                            <input type="range" id="opacity-kml" min="0" max="1" step="0.1" value="1" class="w-16">
                            <button id="clear-kml" class="text-red-400 hover:text-red-300 text-xs ml-2" title="Hapus Layer">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Actions -->
        <div class="p-5 border-t border-gray-700 border-opacity-50 flex flex-col gap-3 bg-gray-800 bg-opacity-30">
            <button id="btn-export" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg transition-all shadow-lg flex items-center justify-center">
                <i class="fa-solid fa-file-export mr-2"></i> Export to DXF
            </button>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Coordinate Display -->
    <div id="coordDisplay" class="coord-display absolute bottom-4 right-4 z-[1000] flex flex-col gap-1">
        <div class="flex items-center gap-2">
            <span class="coord-label">Mouse</span>
            <span id="mouseCoord" class="font-mono text-emerald-400">0.0000, 0.0000</span>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        const App = {
            map: null,
            layers: { osm: null, earth: null },
            groups: {}
        };

        App.layers.osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 22,
            maxNativeZoom: 19,
            attribution: '© OpenStreetMap contributors'
        });

        App.layers.earth = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 22,
            maxNativeZoom: 20,
            attribution: '© Google Maps'
        });

        App.map = L.map('map', {
            center: [-0.7893, 113.9213],
            zoom: 5,
            layers: [App.layers.osm],
            zoomControl: false
        });

        L.control.zoom({ position: 'topright' }).addTo(App.map);
        L.control.scale({ position: 'bottomright', metric: true, imperial: false }).addTo(App.map);

        App.groups.kml = L.featureGroup().addTo(App.map);
        App.groups.draw = L.featureGroup().addTo(App.map);

        const UI = {
            showLoading(text, subtext) {
                const overlay = document.getElementById('loadingOverlay');
                document.getElementById('loadingText').textContent = text || 'Memproses...';
                document.getElementById('loadingSub').textContent = subtext || 'Mohon tunggu sebentar';
                overlay.classList.add('active');
            },
            hideLoading() {
                document.getElementById('loadingOverlay').classList.remove('active');
            },
            updateFeatureCounts() {
                let count = 0;
                App.groups.kml.eachLayer(() => count++);
                document.getElementById('count-kml').textContent = count;
            },
            toast(icon, title, timer = 2000) {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: icon,
                    title: title,
                    showConfirmButton: false,
                    timer: timer,
                    customClass: { popup: 'custom-toast' }
                });
            }
        };

        // --- Base Layer Switcher ---
        document.getElementById('btn-map').addEventListener('click', () => {
            App.map.removeLayer(App.layers.earth);
            App.map.addLayer(App.layers.osm);
            document.getElementById('btn-map').className = "flex-1 py-2 text-sm rounded-md bg-emerald-500 bg-opacity-20 text-emerald-400 font-medium transition-all";
            document.getElementById('btn-earth').className = "flex-1 py-2 text-sm rounded-md text-gray-400 hover:text-white transition-all";
        });
        document.getElementById('btn-earth').addEventListener('click', () => {
            App.map.removeLayer(App.layers.osm);
            App.map.addLayer(App.layers.earth);
            document.getElementById('btn-earth').className = "flex-1 py-2 text-sm rounded-md bg-emerald-500 bg-opacity-20 text-emerald-400 font-medium transition-all";
            document.getElementById('btn-map').className = "flex-1 py-2 text-sm rounded-md text-gray-400 hover:text-white transition-all";
        });

        // --- Handler Import File KML / KMZ (Diperbaiki) ---
        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            UI.showLoading('Membaca file...', file.name);
            try {
                let kmlText = '';
                const fileNameLower = file.name.toLowerCase();

                if (fileNameLower.endsWith('.kmz')) {
                    const zip = new JSZip();
                    const zipContent = await zip.loadAsync(file);
                    const kmlFileName = Object.keys(zipContent.files).find(filename => filename.toLowerCase().endsWith('.kml'));
                    
                    if (!kmlFileName) {
                        throw new Error('File KML tidak ditemukan di dalam arsip KMZ.');
                    }
                    kmlText = await zipContent.files[kmlFileName].async('text');
                } else if (fileNameLower.endsWith('.kml')) {
                    kmlText = await file.text();
                } else {
                    throw new Error('Format file tidak didukung. Harap gunakan .kml atau .kmz');
                }

                const dom = new DOMParser().parseFromString(kmlText, 'text/xml');
                const converted = toGeoJSON.kml(dom);

                App.groups.kml.clearLayers();
                
                const geoJsonLayer = L.geoJSON(converted, {
                    onEachFeature: (feature, layer) => {
                        if (feature.properties && (feature.properties.name || feature.properties.description)) {
                            layer.bindPopup(`<b>${feature.properties.name || 'Objek'}</b><br>${feature.properties.description || ''}`);
                        }
                    },
                    pointToLayer: (feature, latlng) => {
                        return L.circleMarker(latlng, { radius: 6, fillColor: '#10b981', color: '#fff', weight: 1, fillOpacity: 0.9 });
                    },
                    style: { color: '#10b981', weight: 3, fillOpacity: 0.2 }
                });

                geoJsonLayer.eachLayer(layer => {
                    App.groups.kml.addLayer(layer);
                });

                if (App.groups.kml.getLayers().length > 0) {
                    App.map.fitBounds(App.groups.kml.getBounds());
                }

                UI.updateFeatureCounts();
                document.getElementById('filename').textContent = file.name;
                document.getElementById('file-info').classList.remove('hidden');
                UI.toast('success', 'File KML/KMZ berhasil di-import!', 2500);
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'Gagal memproses file KML/KMZ: ' + err.message, 'error');
            } finally {
                UI.hideLoading();
                e.target.value = '';
            }
        });

        // --- Mouse Coordinate Tracking ---
        App.map.on('mousemove', (e) => {
            document.getElementById('mouseCoord').textContent = `${e.latlng.lat.toFixed(6)}, ${e.latlng.lng.toFixed(6)}`;
        });
    </script>
</body>
</html>
