<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Merge Map System</title>
    
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        .toolbar { 
            padding: 12px; 
            background: #2c3e50; 
            color: #fff; 
            display: flex; 
            gap: 15px; 
            align-items: center; 
            flex-wrap: wrap; 
        }
        .toolbar label { font-size: 13px; font-weight: bold; }
        .toolbar input, .toolbar button {
            padding: 6px 12px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
        }
        .btn-export { background: #27ae60; color: white; font-weight: bold; }
        .btn-export:hover { background: #219150; }
        #map { height: calc(100vh - 60px); width: 100%; }
    </style>
</head>
<body>

<div class="toolbar">
    <div>
        <label>1. Unggah File A (Base KML/GeoJSON):</label><br>
        <input type="file" id="inputBase" accept=".geojson,.json,.kml">
    </div>
    <div>
        <label>2. Unggah File B (Editan Delta):</label><br>
        <input type="file" id="inputDelta" accept=".json">
    </div>
    <div>
        <br>
        <button class="btn-export" onclick="App.exportDelta()">Simpan File B (Delta JSON)</button>
    </div>
</div>

<div id="map"></div>

<!-- JS Dependencies -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<script>
const App = {
    map: null,
    groups: {
        kml: L.layerGroup(),  // Base Layer (Read-Only File A)
        draw: L.featureGroup() // Delta Layer (User Drawings/Edits File B)
    },
    deletedBaseIds: new Set(),

    init() {
        // Setup Map
        this.map = L.map('map').setView([-2.5489, 118.0149], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(this.map);

        // Append Layer Groups
        this.groups.kml.addTo(this.map);
        this.groups.draw.addTo(this.map);

        // Setup Leaflet Draw Control on App.groups.draw
        const drawControl = new L.Control.Draw({
            edit: { featureGroup: this.groups.draw },
            draw: { circle: false, circlemarker: false }
        });
        this.map.addControl(drawControl);

        // Catch Draw Events
        this.map.on(L.Draw.Event.CREATED, (e) => {
            const layer = e.layer;
            if (!layer.feature) {
                layer.feature = {
                    type: "Feature",
                    properties: { id: 'draw_' + Date.now() },
                    geometry: layer.toGeoJSON().geometry
                };
            }
            this.groups.draw.addLayer(layer);
        });

        // Event Listeners for File Inputs
        document.getElementById('inputBase').addEventListener('change', (e) => this.handleBaseUpload(e));
        document.getElementById('inputDelta').addEventListener('change', (e) => this.handleDeltaUpload(e));
    },

    handleBaseUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const hasActiveEdits = this.groups.draw.getLayers().length > 0;

        // Check active user edits before replacing base
        if (hasActiveEdits) {
            Swal.fire({
                title: 'Konfirmasi Pembaruan File A',
                text: 'Terdeteksi data editan aktif di peta. Bagaimana Anda ingin memproses editan tersebut?',
                icon: 'warning',
                showCancelButton: true,
                showDenyButton: true,
                confirmButtonText: 'Gabungkan (Simpan File B)',
                denyButtonText: 'Timpa Semua (Reset Editan)',
                cancelButtonText: 'Batal'
            }).then((result) => {
                if (result.isConfirmed) {
                    this.processBaseFile(file);
                } else if (result.isDenied) {
                    this.groups.draw.clearLayers();
                    this.deletedBaseIds.clear();
                    this.processBaseFile(file);
                } else {
                    event.target.value = ''; 
                }
            });
        } else {
            this.processBaseFile(file);
        }
    },

    processBaseFile(file) {
        this.groups.kml.clearLayers();
        const reader = new FileReader();

        reader.onload = (e) => {
            const content = e.target.result;
            try {
                if (file.name.endsWith('.kml')) {
                    const kmlLayer = omnivore.kml.parse(content);
                    kmlLayer.on('ready', () => {
                        this.renderBaseGeoJSON(kmlLayer.toGeoJSON());
                    });
                } else {
                    const geojson = JSON.parse(content);
                    this.renderBaseGeoJSON(geojson);
                }
            } catch (err) {
                Swal.fire('Error', 'Gagal memproses format File A.', 'error');
            }
        };

        reader.readAsText(file);
    },

    renderBaseGeoJSON(geojson) {
        L.geoJSON(geojson, {
            onEachFeature: (feature, layer) => {
                if (!feature.properties) feature.properties = {};
                if (!feature.properties.id) {
                    feature.properties.id = 'base_' + Math.random().toString(36).substr(2, 9);
                }

                // Filter out deleted base items
                if (!this.deletedBaseIds.has(feature.properties.id)) {
                    this.groups.kml.addLayer(layer);
                }
            }
        });
        Swal.fire('Sukses', 'File A berhasil diperbarui tanpa menghapus editan!', 'success');
    },

    exportDelta() {
        const userDrawings = this.groups.draw.toGeoJSON();
        
        const deltaPayload = {
            version: "2.0",
            timestamp: new Date().toISOString(),
            userDrawings: userDrawings,
            deletedBaseIds: Array.from(this.deletedBaseIds)
        };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(deltaPayload, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `File_B_Delta_${Date.now()}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    },

    handleDeltaUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const delta = JSON.parse(e.target.result);
                
                if (delta.userDrawings) {
                    this.groups.draw.clearLayers();
                    L.geoJSON(delta.userDrawings, {
                        onEachFeature: (feature, layer) => {
                            this.groups.draw.addLayer(layer);
                        }
                    });
                }

                if (delta.deletedBaseIds) {
                    this.deletedBaseIds = new Set(delta.deletedBaseIds);
                }

                Swal.fire('Sukses', 'File B (Delta) berhasil dimuat ke atas peta!', 'success');
            } catch (err) {
                Swal.fire('Error', 'Format File B tidak valid.', 'error');
            }
        };
        reader.readAsText(file);
    }
};

window.onload = () => App.init();
</script>
</body>
</html>
