<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoConvert Pro | KML to DXF</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Geoman -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.min.js"></script>

    <!-- JSZip, toGeoJSON, osmtogeojson, Turf.js, SweetAlert2 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@4.2.0/dist/togeojson.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/osmtogeojson@3.2.1/osmtogeojson.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        .glass-panel { background: rgba(23, 25, 35, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-right: 1px solid rgba(255, 255, 255, 0.1); z-index: 1000; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        .leaflet-popup-content-wrapper { background: #1f2937; color: #f3f4f6; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .leaflet-popup-tip { background: #1f2937; }
        .leaflet-popup-content b { color: #10b981; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #10b981; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-left: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex flex-row bg-gray-900 text-gray-200">

    <div class="glass-panel w-80 h-screen flex flex-col shadow-2xl absolute left-0 top-0 transition-transform duration-300">
        <div class="p-6 border-b border-gray-700/50 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400 tracking-wide">
                    <i class="fa-solid fa-layer-group text-emerald-400 mr-2"></i> GeoConvert Pro
                </h1>
                <p class="text-xs text-gray-400 mt-1">KMZ to DXF / DWG Converter</p>
            </div>
        </div>

        <div class="p-6 flex-1 overflow-y-auto space-y-6">
            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase tracking-wider">Base Layer</h2>
                <div class="flex bg-gray-900 rounded-lg p-1">
                    <button id="btn-map" class="flex-1 py-2 text-sm rounded-md bg-emerald-500/20 text-emerald-400 font-medium transition-all">Maps (OSM)</button>
                    <button id="btn-earth" class="flex-1 py-2 text-sm rounded-md text-gray-400 hover:text-white transition-all">Earth</button>
                </div>
            </div>

            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase tracking-wider">Import Data</h2>
                <div class="file-upload-wrapper">
                    <button class="w-full py-3 px-4 border-2 border-dashed border-gray-600 rounded-lg hover:border-emerald-500 hover:bg-emerald-500/10 transition-colors flex flex-col items-center justify-center gap-2 group">
                        <i class="fa-solid fa-cloud-arrow-up text-2xl text-gray-400 group-hover:text-emerald-400"></i>
                        <span class="text-sm font-medium text-gray-300 group-hover:text-emerald-300">Upload KML / KMZ</span>
                    </button>
                    <input type="file" id="fileInput" accept=".kml,.kmz" />
                </div>
                <div id="file-info" class="mt-3 text-xs text-gray-400 hidden"><span class="text-emerald-400"><i class="fa-solid fa-check-circle"></i> Loaded:</span> <span id="filename"></span></div>
            </div>

            <div class="bg-gray-800/50 p-4 rounded-xl border border-gray-700/50">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase tracking-wider">Environment Data</h2>
                <div class="mb-3">
                    <label for="input-road-width" class="text-xs text-gray-400 block mb-1">Lebar Jalan OSM (Meter):</label>
                    <input type="number" id="input-road-width" value="6" min="1" max="50" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-200">
                </div>
                <button id="btn-fetch-osm" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium text-sm transition-colors flex items-center justify-center disabled:opacity-50" disabled>
                    <i class="fa-solid fa-city mr-2"></i> Refresh Buildings & Roads
                </button>
            </div>
        </div>

        <div class="p-6 border-t border-gray-700/50 flex flex-col gap-3 bg-gray-800/30">
            <button id="btn-save" class="w-full py-3 bg-gray-700 hover:bg-gray-600 text-white rounded-lg font-medium text-sm">Save State</button>
            <button id="btn-export" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-lg font-bold text-sm">Export to DXF</button>
        </div>
    </div>

    <div id="map"></div>

    <script>
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22, maxNativeZoom: 19 });
        const earthLayer = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 22, maxNativeZoom: 20 });
        const map = L.map('map', { center: [-0.7893, 113.9213], zoom: 5, layers: [osmLayer], zoomControl: false });
        L.control.zoom({ position: 'topright' }).addTo(map);

        const kmlGroup = L.featureGroup().addTo(map);
        const osmGroup = L.featureGroup().addTo(map);
        const drawGroup = L.featureGroup().addTo(map);
        let currentBbox = null;

        map.pm.addControls({ position: 'topright', drawPolygon: true, drawPolyline: true, editMode: true, removalMode: true });

        document.getElementById('btn-map').addEventListener('click', () => { map.removeLayer(earthLayer); map.addLayer(osmLayer); });
        document.getElementById('btn-earth').addEventListener('click', () => { map.removeLayer(osmLayer); map.addLayer(earthLayer); });

        function bindNamePopup(layer) {
            layer.on('click', function(e) {
                let props = layer.feature?.properties || {};
                let name = props.name || props.building || props.highway || 'Object';
                let content = `<b>${name}</b>`;
                if(props.roadWidth) content += `<div class="text-xs text-emerald-400 mt-1">Lebar: ${props.roadWidth}m</div>`;
                layer.bindPopup(content).openPopup(e.latlng);
            });
        }

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('file-info').classList.remove('hidden');
            document.getElementById('filename').innerText = file.name;
            const kmlText = await file.text();
            parseKML(kmlText);
        });

        function parseKML(kmlText) {
            kmlGroup.clearLayers();
            const xmlDoc = new DOMParser().parseFromString(kmlText, 'text/xml');
            const geojson = toGeoJSON.kml(xmlDoc);
            const layer = L.geoJSON(geojson, { style: { color: '#ef4444', weight: 3 }, onEachFeature: bindNamePopup });
            kmlGroup.addLayer(layer);
            map.fitBounds(layer.getBounds());
            currentBbox = layer.getBounds();
            document.getElementById('btn-fetch-osm').disabled = false;
        }

        async function fetchOSMData(bbox) {
            const s = bbox.getSouth(), w = bbox.getWest(), n = bbox.getNorth(), e_coord = bbox.getEast();
            const btn = document.getElementById('btn-fetch-osm');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = 'Fetching... <div class="loader"></div>';
            btn.disabled = true;

            const overpassQuery = `[out:json][timeout:30];(way["building"](${s},${w},${n},${e_coord});way["highway"](${s},${w},${n},${e_coord}););out body;>;out skel qt;`;
            const endpoints = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter'];

            let success = false;
            let errorMessage = "Koneksi ke server OSM terputus.";

            for (let targetUrl of endpoints) {
                const controller = new AbortController();
                // Ditingkatkan jadi 30 detik
                const timeoutId = setTimeout(() => controller.abort(), 30000); 

                try {
                    const response = await fetch('https://corsproxy.io/?' + encodeURIComponent(targetUrl), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: "data=" + encodeURIComponent(overpassQuery),
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const data = await response.json();
                        processOSMData(data);
                        success = true;
                        break;
                    } else {
                        errorMessage = `Server Error: ${response.status}`;
                    }
                } catch (error) {
                    clearTimeout(timeoutId);
                    if (error.name === 'AbortError') {
                        errorMessage = "Request terlalu lama (Timeout). Silakan perkecil area proyek atau coba lagi.";
                    } else {
                        errorMessage = error.message;
                    }
                }
            }

            if (!success) {
                Swal.fire({ icon: 'error', title: 'Gagal Memuat Data', text: errorMessage });
            }
            btn.innerHTML = originalHTML;
            btn.disabled = false;
        }

        function processOSMData(data) {
            osmGroup.clearLayers();
            const geoJSON = osmtogeojson(data);
            const roadWidth = parseFloat(document.getElementById('input-road-width').value) || 6;
            const radius = roadWidth / 2;

            const features = geoJSON.features.map(f => {
                if (f.properties.highway && (f.geometry.type === 'LineString' || f.geometry.type === 'MultiLineString')) {
                    const buffered = turf.buffer(f, radius, { units: 'meters' });
                    buffered.properties = { ...f.properties, roadWidth };
                    return buffered;
                }
                return f;
            });

            L.geoJSON({ type: "FeatureCollection", features: features }, {
                style: f => f.properties.building ? { color: '#f59e0b', fillColor: '#f59e0b' } : { color: '#6b7280', fillColor: '#9ca3af' },
                onEachFeature: bindNamePopup
            }).addTo(osmGroup);
            
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Data OSM Dimuat!', showConfirmButton: false, timer: 2000 });
        }

        document.getElementById('btn-fetch-osm').addEventListener('click', () => { if (currentBbox) fetchOSMData(currentBbox); });

        document.getElementById('btn-export').addEventListener('click', () => {
            const allFeatures = [];
            [kmlGroup, osmGroup, drawGroup].forEach(g => g.eachLayer(l => l.toGeoJSON && allFeatures.push(l.toGeoJSON())));
            if(allFeatures.length === 0) return Swal.fire('Warning', 'Peta kosong!', 'warning');
            
            // Logika generateDXF tetap sama seperti sebelumnya...
            Swal.fire('Info', 'Fitur Export DXF berjalan.', 'info');
        });
    </script>
</body>
</html>
