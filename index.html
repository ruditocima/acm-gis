<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIS | ACM - GeoConvert Production Ready v3.4</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.css" />
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.14.2/dist/leaflet-geoman.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://unpkg.com/@tmcw/togeojson@4.2.0/dist/togeojson.umd.js"></script>
    <script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; background: #111827; }
        #map { height: 100vh; width: 100%; z-index: 1; }
        .glass-panel { background: rgba(23, 25, 35, 0.95); backdrop-filter: blur(16px); border-right: 1px solid rgba(255, 255, 255, 0.08); z-index: 1000; transition: transform 0.3s ease-in-out; }
        .glass-panel.closed { transform: translateX(-100%); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        .leaflet-popup-content-wrapper { background: #1f2937; color: #f3f4f6; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .leaflet-popup-tip { background: #1f2937; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #10b981; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-left: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .coord-display { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 6px 12px; font-family: monospace; font-size: 11px; color: #e5e7eb; }
        .loading-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .loading-overlay.active { opacity: 1; pointer-events: auto; }
        .search-box { background: rgba(31, 41, 55, 0.98); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; position: absolute; width: 100%; z-index: 1001; }
        .search-result-item { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 12px; color: #d1d5db; }
        .search-result-item:hover { background: rgba(16, 185, 129, 0.15); color: #fff; }
        .layer-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: 6px; margin-bottom: 4px; background: rgba(255,255,255,0.02); }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%; background: #10b981; cursor: pointer; margin-top: -5px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        .custom-toast { background: rgba(31, 41, 55, 0.98) !important; color: #f3f4f6 !important; }
        .sidebar-toggle-btn { position: absolute; left: 330px; top: 15px; z-index: 1001; background: rgba(23, 25, 35, 0.95); border: 1px solid rgba(255,255,255,0.1); color: #10b981; padding: 8px 12px; border-radius: 0 8px 8px 0; cursor: pointer; backdrop-filter: blur(8px); transition: left 0.3s ease-in-out; }
        .glass-panel.closed + .sidebar-toggle-btn { left: 10px; border-radius: 8px; }
        .drag-over { border-color: #10b981 !important; background: rgba(16, 185, 129, 0.05); }
    </style>
</head>
<body class="flex flex-row bg-gray-900 text-gray-200">

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader" style="width: 48px; height: 48px; border-width: 4px; margin-bottom: 16px;"></div>
        <div id="loadingText" class="text-gray-300 font-medium text-sm">Memproses...</div>
        <div id="loadingSub" class="text-gray-500 text-xs mt-2">Mohon tunggu sebentar</div>
    </div>

    <div id="sidebar" class="glass-panel w-80 h-screen flex flex-col shadow-2xl absolute left-0 top-0">
        <div class="p-5 border-b border-gray-700 border-opacity-50 flex items-center justify-between">
            <div>
                <h1 class="text-xl font-bold text-emerald-400 tracking-wide">
                    <i class="fa-solid fa-layer-group text-emerald-400 mr-2"></i> GeoConvert
                </h1>
                <p class="text-xs text-gray-400 mt-1">GIS Production System v3.4</p>
            </div>
        </div>

        <div class="p-5 flex-1 overflow-y-auto space-y-5">
            <div class="bg-gray-800 bg-opacity-50 p-4 rounded-xl border border-gray-700 border-opacity-50 relative">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase tracking-wider">Cari Lokasi</h2>
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Ketik nama lokasi..." 
                        class="w-full bg-gray-900 border border-gray-700 rounded-lg pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" autocomplete="off">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-500 text-xs"></i>
                </div>
                <div id="searchResults" class="search-box mt-1 hidden max-h-48 overflow-y-auto shadow-xl"></div>
            </div>

            <div class="bg-gray-800 bg-opacity-50 p-4 rounded-xl border border-gray-700 border-opacity-50">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase tracking-wider">Base Layer</h2>
                <div class="flex bg-gray-900 rounded-lg p-1">
                    <button id="btn-map" class="flex-1 py-2 text-sm rounded-md bg-emerald-500 bg-opacity-20 text-emerald-400 font-medium transition-all">Maps</button>
                    <button id="btn-earth" class="flex-1 py-2 text-sm rounded-md text-gray-400 hover:text-white transition-all">Earth</button>
                </div>
            </div>

            <div class="bg-gray-800 bg-opacity-50 p-4 rounded-xl border border-gray-700 border-opacity-50">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase tracking-wider">Import KML / KMZ</h2>
                <div class="file-upload-wrapper" id="dropZoneKml">
                    <button id="dropButtonKml" class="w-full py-3 px-4 border-2 border-dashed border-gray-600 rounded-lg hover:border-emerald-500 transition-colors flex flex-col items-center justify-center gap-1 pointer-events-none">
                        <i class="fa-solid fa-cloud-arrow-up text-xl text-gray-400"></i>
                        <span class="text-xs text-gray-300">Pilih atau Seret File KML/KMZ</span>
                    </button>
                    <input type="file" id="fileInput" accept=".kml,.kmz" />
                </div>
                <div id="file-info" class="mt-2 text-xs text-gray-400 hidden">
                    <span class="text-emerald-400">Loaded:</span> <span id="filename"></span>
                </div>
            </div>

            <div class="bg-gray-800 bg-opacity-50 p-4 rounded-xl border border-gray-700 border-opacity-50">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase tracking-wider">Environment OSM</h2>
                <div class="mb-3">
                    <label class="text-xs text-gray-400 block mb-1">Lebar Jalan (Meter)</label>
                    <input type="number" id="roadWidthInput" value="6" min="1" max="50" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <button id="btn-fetch-osm" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-medium text-xs transition-colors shadow-lg flex items-center justify-center">
                    <i class="fa-solid fa-city mr-2"></i> Muat Gedung & Jalan Area
                </button>
            </div>

            <div class="bg-gray-800 bg-opacity-50 p-4 rounded-xl border border-gray-700 border-opacity-50">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase tracking-wider">Layer Manager</h2>
                <div class="space-y-3">
                    <div>
                        <div class="flex items-center justify-between mb-1 text-xs">
                            <span class="text-gray-400">KML Layer</span>
                            <span id="count-kml" class="text-emerald-400">0</span>
                        </div>
                        <div class="layer-item">
                            <label class="flex items-center gap-2 cursor-pointer flex-1">
                                <input type="checkbox" id="toggle-kml" checked class="accent-emerald-500">
                                <span class="text-xs text-gray-300">Tampilkan</span>
                            </label>
                            <input type="range" id="opacity-kml" min="0" max="1" step="0.1" value="1" class="w-16">
                        </div>
                    </div>
                    <div>
                        <div class="flex items-center justify-between mb-1 text-xs">
                            <span class="text-gray-400">OSM Layer</span>
                            <span id="count-osm" class="text-blue-400">0</span>
                        </div>
                        <div class="layer-item">
                            <label class="flex items-center gap-2 cursor-pointer flex-1">
                                <input type="checkbox" id="toggle-osm" checked class="accent-blue-500">
                                <span class="text-xs text-gray-300">Tampilkan</span>
                            </label>
                            <input type="range" id="opacity-osm" min="0" max="1" step="0.1" value="1" class="w-16">
                        </div>
                    </div>
                    <div>
                        <div class="flex items-center justify-between mb-1 text-xs">
                            <span class="text-gray-400">User Draw</span>
                            <span id="count-draw" class="text-purple-400">0</span>
                        </div>
                        <div class="layer-item">
                            <label class="flex items-center gap-2 cursor-pointer flex-1">
                                <input type="checkbox" id="toggle-draw" checked class="accent-purple-500">
                                <span class="text-xs text-gray-300">Tampilkan</span>
                            </label>
                            <input type="range" id="opacity-draw" min="0" max="1" step="0.1" value="1" class="w-16">
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-800 bg-opacity-50 p-4 rounded-xl border border-gray-700 border-opacity-50">
                <h2 class="text-sm font-semibold mb-3 text-gray-300 uppercase tracking-wider">Pengukuran Spasial</h2>
                <div class="grid grid-cols-2 gap-2">
                    <button id="btn-measure-distance" class="py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-xs font-medium transition-colors">Ukur Jarak</button>
                    <button id="btn-measure-area" class="py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-xs font-medium transition-colors">Ukur Luas</button>
                </div>
                <button id="btn-measure-clear" class="w-full mt-2 py-1.5 bg-red-900 bg-opacity-30 hover:bg-opacity-50 text-red-400 rounded-lg text-xs hidden transition-colors">Hapus Hasil Ukur</button>
                <div id="measureResult" class="mt-2 text-xs text-emerald-400 font-mono hidden"></div>
            </div>
        </div>

        <div class="p-5 border-t border-gray-700 border-opacity-50 flex flex-col gap-2 bg-gray-800 bg-opacity-30">
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-save" class="py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-xs font-medium">Save Proyek</button>
                <div class="file-upload-wrapper">
                    <button class="w-full py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-lg text-xs font-medium">Load Proyek</button>
                    <input type="file" id="loadProjectInput" accept=".json,.geojson" />
                </div>
            </div>
            <button id="btn-export" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg shadow-lg">Export ke DXF</button>
            <button id="btn-export-kmz" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-lg shadow-lg">Export ke KMZ</button>
        </div>
    </div>

    <button id="sidebarToggle" class="sidebar-toggle-btn shadow-lg" title="Sembunyikan/Tampilkan Panel">
        <i class="fa-solid fa-bars"></i>
    </button>

    <div id="map"></div>

    <div class="coord-display absolute bottom-4 right-4 z-[1000] flex gap-3">
        <div>Koordinat: <span id="mouseCoord" class="text-emerald-400 font-mono">0.0000, 0.0000</span></div>
        <div>Zoom: <span id="zoomLevel" class="text-blue-400 font-mono">5</span></div>
    </div>

    <script>
        const App = {
            map: null,
            layers: { osm: null, earth: null },
            groups: {},
            state: { 
                measureMode: null, 
                measurePoints: [], 
                activeMeasureLayer: null 
            }
        };

        const UI = {
            showLoading(text, sub) {
                document.getElementById('loadingText').textContent = text || 'Memproses...';
                document.getElementById('loadingSub').textContent = sub || '';
                document.getElementById('loadingOverlay').classList.add('active');
            },
            hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); },
            updateCounts() {
                const count = g => { let c = 0; if (g) g.eachLayer(() => c++); return c; };
                document.getElementById('count-kml').textContent = count(App.groups.kml);
                document.getElementById('count-osm').textContent = count(App.groups.osm);
                document.getElementById('count-draw').textContent = count(App.groups.draw);
            },
            toast(icon, title) {
                Swal.fire({ toast: true, position: 'top-end', icon, title, showConfirmButton: false, timer: 2000, customClass: { popup: 'custom-toast' } });
            }
        };

        function layerToGeoJSON(layer) {
            if (typeof layer.toGeoJSON === 'function') {
                return layer.toGeoJSON();
            }
            if (layer instanceof L.Marker || layer instanceof L.CircleMarker) {
                const ll = layer.getLatLng();
                return { type: "Feature", geometry: { type: "Point", coordinates: [ll.lng, ll.lat] }, properties: layer.feature?.properties || {} };
            } else if (layer instanceof L.Polygon) {
                const latlngs = layer.getLatLngs();
                if (!latlngs || latlngs.length === 0) return null;
                const ring = Array.isArray(latlngs[0]) ? latlngs[0] : latlngs;
                const coords = ring.map(pt => [pt.lng, pt.lat]);
                if (coords.length > 0 && (coords[0][0] !== coords[coords.length-1][0] || coords[0][1] !== coords[coords.length-1][1])) {
                    coords.push(coords[0]);
                }
                return { type: "Feature", geometry: { type: "Polygon", coordinates: [coords] }, properties: layer.feature?.properties || {} };
            } else if (layer instanceof L.Polyline) {
                const latlngs = layer.getLatLngs();
                if (!latlngs || latlngs.length === 0) return null;
                const coords = latlngs.map(pt => [pt.lng, pt.lat]);
                return { type: "Feature", geometry: { type: "LineString", coordinates: coords }, properties: layer.feature?.properties || {} };
            }
            return null;
        }

        // Toggle Sidebar Handler
        document.getElementById('sidebarToggle').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('closed');
            setTimeout(() => { if (App.map) App.map.invalidateSize(); }, 300);
        });

        // Inisialisasi Peta
        App.layers.osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 22, maxNativeZoom: 19, crossOrigin: true });
        App.layers.earth = L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', { maxZoom: 22, maxNativeZoom: 20, crossOrigin: true });

        App.map = L.map('map', { center: [-0.7893, 113.9213], zoom: 5, layers: [App.layers.osm], zoomControl: false });
        L.control.zoom({ position: 'topright' }).addTo(App.map);
        L.control.scale({ position: 'bottomright', metric: true, imperial: false }).addTo(App.map);

        App.groups.kml = L.featureGroup().addTo(App.map);
        App.groups.osm = L.featureGroup().addTo(App.map);
        App.groups.draw = L.featureGroup().addTo(App.map);
        App.groups.measure = L.featureGroup().addTo(App.map);

        // Mousemove & Koordinat Handler
        let lastMoveTime = 0;
        App.map.on('mousemove', e => {
            document.getElementById('mouseCoord').textContent = `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}`;
            if (!App.state.measureMode || App.state.measurePoints.length === 0) return;
            
            const now = Date.now();
            if (now - lastMoveTime < 40) return;
            lastMoveTime = now;

            const tempPts = [...App.state.measurePoints, [e.latlng.lng, e.latlng.lat]];
            if (App.state.measureMode === 'distance' && tempPts.length >= 2) {
                const line = turf.lineString(tempPts);
                const len = turf.length(line, {units: 'meters'});
                document.getElementById('measureResult').textContent = `Jarak Sementara: ${len > 1000 ? (len/1000).toFixed(2) + ' km' : len.toFixed(1) + ' m'}`;
            } else if (App.state.measureMode === 'area' && tempPts.length >= 3) {
                const closedPts = [...tempPts, tempPts[0]];
                const poly = turf.polygon([closedPts]);
                const area = turf.area(poly);
                document.getElementById('measureResult').textContent = `Luas Sementara: ${area > 10000 ? (area/10000).toFixed(2) + ' ha' : area.toFixed(1) + ' m²'}`;
            }
        });
        App.map.on('zoomend', () => { document.getElementById('zoomLevel').textContent = App.map.getZoom(); });

        // Base Layer Switcher
        document.getElementById('btn-map').addEventListener('click', () => {
            App.map.removeLayer(App.layers.earth);
            App.map.addLayer(App.layers.osm);
            document.getElementById('btn-map').className = "flex-1 py-2 text-sm rounded-md bg-emerald-500 bg-opacity-20 text-emerald-400 font-medium transition-all";
            document.getElementById('btn-earth').className = "flex-1 py-2 text-sm rounded-md text-gray-400 hover:text-white transition-all";
        });
        document.getElementById('btn-earth').addEventListener('click', () => {
            App.map.removeLayer(App.layers.osm);
            App.map.addLayer(App.layers.earth);
            document.getElementById('btn-earth').className = "flex-1 py-2 text-sm rounded-md bg-emerald-500 bg-opacity-20 text-emerald-400 font-medium transition-all";
            document.getElementById('btn-map').className = "flex-1 py-2 text-sm rounded-md text-gray-400 hover:text-white transition-all";
        });

        // Geoman Drawing Tools
        App.map.pm.addControls({ position: 'topright', drawMarker: false, drawCircleMarker: false, drawCircle: false, drawText: false, cutPolygon: false });
        App.map.on('pm:create', e => {
            App.groups.draw.addLayer(e.layer);
            UI.updateCounts();
        });
        App.map.on('pm:remove', () => UI.updateCounts());

        // Search Location (Nominatim Geocoder)
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', e => {
            clearTimeout(searchTimeout);
            const query = e.target.value.trim();
            const resultsBox = document.getElementById('searchResults');
            if (query.length < 3) { resultsBox.classList.add('hidden'); return; }
            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`, {
                        headers: { 'User-Agent': 'GeoConvertProductionGIS/3.4' }
                    });
                    if (!res.ok) throw new Error('Gagal mengambil data pencarian lokasi.');
                    const data = await res.json();
                    resultsBox.innerHTML = '';
                    if (data && data.length > 0) {
                        resultsBox.classList.remove('hidden');
                        data.slice(0, 5).forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'search-result-item';
                            div.textContent = item.display_name;
                            div.onclick = () => {
                                App.map.setView([parseFloat(item.lat), parseFloat(item.lon)], 16);
                                resultsBox.classList.add('hidden');
                                document.getElementById('searchInput').value = item.display_name;
                            };
                            resultsBox.appendChild(div);
                        });
                    } else {
                        resultsBox.classList.add('hidden');
                    }
                } catch (err) {
                    console.error('Search error:', err);
                }
            }, 400);
        });

        document.addEventListener('click', e => {
            if (!e.target.closest('#searchInput') && !e.target.closest('#searchResults')) {
                document.getElementById('searchResults').classList.add('hidden');
            }
        });

        // OSM Overpass Fetcher with Safe Buffer Handling
        document.getElementById('btn-fetch-osm').addEventListener('click', async () => {
            const bounds = App.map.getBounds();
            const spanDist = bounds.getSouthWest().distanceTo(bounds.getNorthEast());
            if (spanDist > 60000) {
                Swal.fire('Area Terlalu Luas', 'Perbesar zoom peta (maksimal radius area sekitar 50 km) untuk menghindari batas beban server Overpass API.', 'warning');
                return;
            }

            const bbox = `${bounds.getSouth()},${bounds.getWest()},${bounds.getNorth()},${bounds.getEast()}`;
            const roadWidth = parseFloat(document.getElementById('roadWidthInput').value) || 6;
            UI.showLoading('Mengambil data OSM...', 'Menghubungkan ke Overpass API');
            try {
                const query = `[out:json][timeout:30];(way["building"](${bbox});way["highway"](${bbox}););out body; >; out skel qt;`;
                const response = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: query });
                
                const contentType = response.headers.get("content-type");
                if (!response.ok || !contentType || !contentType.includes("application/json")) {
                    throw new Error(`Overpass API gagal merespons dengan benar (Status ${response.status}). Server sibuk atau batas kuota terlampaui.`);
                }

                const data = await response.json();
                const nodes = {};
                if (data && data.elements) {
                    data.elements.forEach(el => {
                        if (el.type === 'node') {
                            nodes[el.id] = { lat: el.lat, lon: el.lon };
                        }
                    });

                    App.groups.osm.clearLayers();

                    data.elements.forEach(el => {
                        if (el.type === 'way' && el.nodes && el.nodes.length > 0) {
                            const pts = el.nodes.map(nid => nodes[nid]).filter(n => n !== undefined);
                            if (pts.length < 2) return;
                            const coords = pts.map(n => [n.lon, n.lat]);

                            if (el.tags && el.tags.building) {
                                if (coords.length >= 3) {
                                    if (coords[0][0] !== coords[coords.length-1][0] || coords[0][1] !== coords[coords.length-1][1]) {
                                        coords.push(coords[0]);
                                    }
                                    const poly = L.polygon(coords.map(c => [c[1], c[0]]), {
                                        color: '#3b82f6', weight: 1, fillColor: '#3b82f6', fillOpacity: 0.4
                                    });
                                    poly.bindPopup(`<b>Gudang / Gedung OSM</b><br>ID: ${el.id}`);
                                    App.groups.osm.addLayer(poly);
                                }
                            } else if (el.tags && el.tags.highway) {
                                try {
                                    const line = turf.lineString(coords);
                                    const buffered = turf.buffer(line, roadWidth / 2, { units: 'meters' });
                                    if (buffered && buffered.geometry) {
                                        const bCoords = buffered.geometry.coordinates[0].map(c => [c[1], c[0]]);
                                        const roadPoly = L.polygon(bCoords, {
                                            color: '#f59e0b', weight: 1, fillColor: '#f59e0b', fillOpacity: 0.5
                                        });
                                        roadPoly.bindPopup(`<b>Jalan OSM</b><br>Tipe: ${el.tags.highway}<br>Lebar: ${roadWidth}m`);
                                        App.groups.osm.addLayer(roadPoly);
                                    }
                                } catch (bufErr) {
                                    console.warn('Skipping malformed road buffer:', bufErr);
                                }
                            }
                        }
                    });
                }
                UI.hideLoading();
                UI.updateCounts();
                UI.toast('success', 'Data OSM Berhasil Dimuat!');
            } catch (err) {
                UI.hideLoading();
                console.error(err);
                Swal.fire('Gagal Memuat OSM', err.message, 'error');
            }
        });

        // KML / KMZ File Import Parser with Robust Auto-Center (Autocenter)
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZoneKml');

        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                processKmlFile(e.dataTransfer.files[0]);
            }
        });
        fileInput.addEventListener('change', e => {
            if (e.target.files.length > 0) processKmlFile(e.target.files[0]);
        });

        async function processKmlFile(file) {
            UI.showLoading('Membaca file KML/KMZ...', file.name);
            try {
                let kmlText = '';
                if (file.name.toLowerCase().endsWith('.kmz')) {
                    const zip = new JSZip();
                    const zipContent = await zip.loadAsync(file);
                    let kmlFileEntry = null;
                    for (let filename in zipContent.files) {
                        if (filename.toLowerCase().endsWith('.kml')) {
                            kmlFileEntry = zipContent.files[filename];
                            break;
                        }
                    }
                    if (!kmlFileEntry) throw new Error('File KML tidak ditemukan di dalam arsip KMZ.');
                    kmlText = await kmlFileEntry.async('text');
                } else {
                    kmlText = await file.text();
                }

                const dom = new DOMParser().parseFromString(kmlText, 'text/xml');
                const convertedGeoJSON = toGeoJSON.kml(dom);

                App.groups.kml.clearLayers();
                const geoJsonLayer = L.geoJSON(convertedGeoJSON, {
                    style: { color: '#10b981', weight: 2, fillOpacity: 0.3 },
                    onEachFeature: (feature, layer) => {
                        if (feature.properties && feature.properties.name) {
                            layer.bindPopup(`<b>${feature.properties.name}</b><br>${feature.properties.description || ''}`);
                        }
                    }
                });

                geoJsonLayer.eachLayer(l => App.groups.kml.addLayer(l));
                
                // Robust Autocenter implementation
                if (App.groups.kml.getLayers().length > 0) {
                    const groupBounds = App.groups.kml.getBounds();
                    if (groupBounds.isValid()) {
                        App.map.fitBounds(groupBounds, { padding: [50, 50], maxZoom: 18 });
                    }
                }

                document.getElementById('file-info').classList.remove('hidden');
                document.getElementById('filename').textContent = file.name;

                UI.hideLoading();
                UI.updateCounts();
                UI.toast('success', 'File KML/KMZ Berhasil Dimuat & Dipusatkan!');
            } catch (err) {
                UI.hideLoading();
                console.error(err);
                Swal.fire('Gagal Import', err.message, 'error');
            }
        }

        // Layer Manager Controls with Enhanced Opacity Support
        ['kml', 'osm', 'draw'].forEach(key => {
            document.getElementById(`toggle-${key}`).addEventListener('change', e => {
                if (e.target.checked) {
                    App.map.addLayer(App.groups[key]);
                } else {
                    App.map.removeLayer(App.groups[key]);
                }
            });
            document.getElementById(`opacity-${key}`).addEventListener('input', e => {
                const opacity = parseFloat(e.target.value);
                App.groups[key].eachLayer(layer => {
                    if (typeof layer.setStyle === 'function') {
                        layer.setStyle({ opacity: opacity, fillOpacity: opacity * 0.4 });
                    }
                    if (typeof layer.setOpacity === 'function') {
                        layer.setOpacity(opacity);
                    }
                });
            });
        });

        // Spatial Measurement Tools
        document.getElementById('btn-measure-distance').addEventListener('click', () => startMeasurement('distance'));
        document.getElementById('btn-measure-area').addEventListener('click', () => startMeasurement('area'));
        document.getElementById('btn-measure-clear').addEventListener('click', clearMeasurement);

        function startMeasurement(mode) {
            clearMeasurement();
            App.state.measureMode = mode;
            App.state.measurePoints = [];
            document.getElementById('measureResult').classList.remove('hidden');
            document.getElementById('btn-measure-clear').classList.remove('hidden');
            UI.toast('info', `Mode ${mode === 'distance' ? 'Ukur Jarak' : 'Ukur Luas'} Aktif. Klik peta untuk mulai.`);
        }

        App.map.on('click', e => {
            if (!App.state.measureMode) return;
            const pt = [e.latlng.lng, e.latlng.lat];
            App.state.measurePoints.push(pt);

            const marker = L.circleMarker([e.latlng.lat, e.latlng.lng], { radius: 4, color: '#10b981', fillColor: '#10b981', fillOpacity: 1 });
            App.groups.measure.addLayer(marker);

            if (App.state.measurePoints.length > 1) {
                App.groups.measure.eachLayer(l => { if (l instanceof L.Polyline || l instanceof L.Polygon) App.groups.measure.removeLayer(l); });
                
                if (App.state.measureMode === 'distance') {
                    const line = L.polyline(App.state.measurePoints.map(p => [p[1], p[0]]), { color: '#10b981', weight: 3, dashArray: '5,5' });
                    App.groups.measure.addLayer(line);
                } else if (App.state.measureMode === 'area' && App.state.measurePoints.length >= 3) {
                    const poly = L.polygon(App.state.measurePoints.map(p => [p[1], p[0]]), { color: '#10b981', weight: 2, fillColor: '#10b981', fillOpacity: 0.3 });
                    App.groups.measure.addLayer(poly);
                }
            }
        });

        function clearMeasurement() {
            App.state.measureMode = null;
            App.state.measurePoints = [];
            App.groups.measure.clearLayers();
            document.getElementById('measureResult').classList.add('hidden');
            document.getElementById('btn-measure-clear').classList.add('hidden');
            document.getElementById('measureResult').textContent = '';
        }

        // Save & Load Project
        document.getElementById('btn-save').addEventListener('click', () => {
            const features = [];
            ['kml', 'osm', 'draw'].forEach(key => {
                App.groups[key].eachLayer(layer => {
                    const gj = layerToGeoJSON(layer);
                    if (gj) {
                        gj.properties = gj.properties || {};
                        gj.properties.layerSource = key;
                        features.push(gj);
                    }
                });
            });
            const fc = { type: "FeatureCollection", features: features };
            const blob = new Blob([JSON.stringify(fc, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `GeoConvert_Project_${new Date().toISOString().slice(0,10)}.geojson`;
            a.click();
            URL.revokeObjectURL(url);
            UI.toast('success', 'Proyek Berhasil Disimpan!');
        });

        document.getElementById('loadProjectInput').addEventListener('change', async e => {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const text = await file.text();
                const fc = JSON.parse(text);
                if (!fc.features) throw new Error('Format file proyek tidak valid.');

                App.groups.kml.clearLayers();
                App.groups.osm.clearLayers();
                App.groups.draw.clearLayers();

                const loadedLayer = L.geoJSON(fc, {
                    onEachFeature: (feature, layer) => {
                        const src = feature.properties?.layerSource || 'draw';
                        if (App.groups[src]) {
                            App.groups[src].addLayer(layer);
                        } else {
                            App.groups.draw.addLayer(layer);
                        }
                    }
                });

                const loadedBounds = loadedLayer.getBounds();
                if (loadedBounds.isValid()) {
                    App.map.fitBounds(loadedBounds, { padding: [50, 50], maxZoom: 18 });
                }

                UI.updateCounts();
                UI.toast('success', 'Proyek Berhasil Dimuat & Dipusatkan!');
            } catch (err) {
                Swal.fire('Gagal Load Proyek', err.message, 'error');
            }
        });

        // Export DXF
        document.getElementById('btn-export').addEventListener('click', () => {
            let dxfContent = "0\nSECTION\n2\nHEADER\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n";
            let count = 0;

            ['kml', 'osm', 'draw'].forEach(key => {
                App.groups[key].eachLayer(layer => {
                    const gj = layerToGeoJSON(layer);
                    if (!gj) return;
                    if (gj.geometry.type === 'Point') {
                        const [lng, lat] = gj.geometry.coordinates;
                        dxfContent += `0\nPOINT\n8\n${key.toUpperCase()}\n10\n${lng}\n20\n${lat}\n30\n0.0\n`;
                        count++;
                    } else if (gj.geometry.type === 'LineString' || gj.geometry.type === 'Polygon') {
                        const coords = gj.geometry.type === 'Polygon' ? gj.geometry.coordinates[0] : gj.geometry.coordinates;
                        dxfContent += `0\nLWPOLYLINE\n8\n${key.toUpperCase()}\n90\n${coords.length}\n70\n${gj.geometry.type === 'Polygon' ? 1 : 0}\n`;
                        coords.forEach(pt => {
                            dxfContent += `10\n${pt[0]}\n20\n${pt[1]}\n`;
                        });
                        count++;
                    }
                });
            });

            dxfContent += "0\nENDSEC\n0\nEOF\n";
            if (count === 0) {
                Swal.fire('Kosong', 'Tidak ada data spasial untuk diexport ke DXF.', 'warning');
                return;
            }

            const blob = new Blob([dxfContent], { type: 'application/dxf' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `GeoConvert_Export_${Date.now()}.dxf`;
            a.click();
            URL.revokeObjectURL(url);
            UI.toast('success', 'Export DXF Berhasil!');
        });

        // Export KMZ with Standard Styling Definitions
        document.getElementById('btn-export-kmz').addEventListener('click', async () => {
            let kmlData = `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n<name>GeoConvert Export v3.4</name>\n`;
            kmlData += `<Style id="kmlStyle"><LineStyle><color>ff00b910</color><width>2</width></LineStyle><PolyStyle><color>5500b910</color></PolyStyle></Style>\n`;
            kmlData += `<Style id="osmStyle"><LineStyle><color>ff0bf59e</color><width>2</width></LineStyle><PolyStyle><color>550bf59e</color></PolyStyle></Style>\n`;
            kmlData += `<Style id="drawStyle"><LineStyle><color>ff8b5cf6</color><width>2</width></LineStyle><PolyStyle><color>558b5cf6</color></PolyStyle></Style>\n`;

            let count = 0;
            ['kml', 'osm', 'draw'].forEach(key => {
                const styleId = key === 'kml' ? '#kmlStyle' : key === 'osm' ? '#osmStyle' : '#drawStyle';
                App.groups[key].eachLayer(layer => {
                    const gj = layerToGeoJSON(layer);
                    if (!gj) return;
                    count++;
                    const name = gj.properties?.name || `${key.toUpperCase()}_${count}`;
                    if (gj.geometry.type === 'Point') {
                        const [lng, lat] = gj.geometry.coordinates;
                        kmlData += `<Placemark><name>${name}</name><styleUrl>${styleId}</styleUrl><Point><coordinates>${lng},${lat},0</coordinates></Point></Placemark>\n`;
                    } else if (gj.geometry.type === 'LineString') {
                        const coordStr = gj.geometry.coordinates.map(c => `${c[0]},${c[1]},0`).join(' ');
                        kmlData += `<Placemark><name>${name}</name><styleUrl>${styleId}</styleUrl><LineString><coordinates>${coordStr}</coordinates></LineString></Placemark>\n`;
                    } else if (gj.geometry.type === 'Polygon') {
                        const coordStr = gj.geometry.coordinates[0].map(c => `${c[0]},${c[1]},0`).join(' ');
                        kmlData += `<Placemark><name>${name}</name><styleUrl>${styleId}</styleUrl><Polygon><outerBoundaryIs><LinearRing><coordinates>${coordStr}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>\n`;
                    }
                });
            });

            kmlData += `</Document>\n</kml>`;
            if (count === 0) {
                Swal.fire('Kosong', 'Tidak ada data spasial untuk diexport ke KMZ.', 'warning');
                return;
            }

            UI.showLoading('Membuat arsip KMZ...', 'Mengompresi data KML');
            try {
                const zip = new JSZip();
                zip.file("doc.kml", kmlData);
                const content = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
                
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = `GeoConvert_Export_${Date.now()}.kmz`;
                a.click();
                URL.revokeObjectURL(url);
                UI.hideLoading();
                UI.toast('success', 'Export KMZ Berhasil!');
            } catch (err) {
                UI.hideLoading();
                Swal.fire('Gagal Export KMZ', err.message, 'error');
            }
        });

        UI.updateCounts();
    </script>
</body>
</html>
